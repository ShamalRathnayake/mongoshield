# Source: mongoshield-operator/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: mongoshield-operator
  namespace: mongoshield-system
  labels:
    app.kubernetes.io/name: mongoshield-operator
    app.kubernetes.io/instance: mongoshield-operator
    app.kubernetes.io/version: "next"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/part-of: mongoshield
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongoshield-operator
    app.kubernetes.io/instance: mongoshield-operator
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http
      protocol: TCP

---
# Source: mongoshield-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongoshield-operator
  namespace: mongoshield-system
  labels:
    app.kubernetes.io/name: mongoshield-operator
    app.kubernetes.io/instance: mongoshield-operator
    app.kubernetes.io/version: "next"
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/part-of: mongoshield
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongoshield-operator
      app.kubernetes.io/instance: mongoshield-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongoshield-operator
        app.kubernetes.io/instance: mongoshield-operator
    spec:
      serviceAccountName: mongoshield-operator
      # The operator talks to the Kubernetes API, so it needs its token.
      automountServiceAccountToken: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Graceful shutdown finishes running reconciles (up to 20 s) and releases the Lease.
      terminationGracePeriodSeconds: 30
      containers:
        - name: operator
          image: "ghcr.io/shamalrathnayake/mongoshield-operator:next"
          imagePullPolicy: IfNotPresent
          env:
            # Identity for leader election and events, and where the Lease lives.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_NAMESPACES
              value: ""
            - name: MONGOSHIELD_IMAGE
              value: "ghcr.io/shamalrathnayake/mongoshield:latest"
            - name: LEADER_ELECTION
              value: "true"
            - name: LEADER_ELECTION_LEASE
              value: "mongoshield-operator"
            - name: WORKERS
              value: "2"
            - name: RESYNC_SECONDS
              value: "600"
            - name: LOG_LEVEL
              value: "info"
            - name: HTTP_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 96Mi
