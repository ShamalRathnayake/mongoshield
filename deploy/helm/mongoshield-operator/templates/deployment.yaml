{{- /*
The operator Deployment. With leader election, extra replicas stand by with warm
caches and take over within seconds when the leader goes away.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mongoshield-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongoshield-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mongoshield-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mongoshield-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mongoshield-operator.serviceAccountName" . }}
      # The operator talks to the Kubernetes API, so it needs its token.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Graceful shutdown finishes running reconciles (up to 20 s) and releases the Lease.
      terminationGracePeriodSeconds: 30
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Identity for leader election and events, and where the Lease lives.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_NAMESPACES
              value: {{ join "," .Values.watchNamespaces | quote }}
            - name: MONGOSHIELD_IMAGE
              value: {{ include "mongoshield-operator.jobImage" . | quote }}
            {{- with .Values.jobImage.pullPolicy }}
            - name: MONGOSHIELD_IMAGE_PULL_POLICY
              value: {{ . | quote }}
            {{- end }}
            - name: LEADER_ELECTION
              value: {{ .Values.leaderElection.enabled | quote }}
            - name: LEADER_ELECTION_LEASE
              value: {{ include "mongoshield-operator.fullname" . | quote }}
            - name: WORKERS
              value: {{ .Values.workers | quote }}
            - name: RESYNC_SECONDS
              value: {{ .Values.resyncSeconds | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: HTTP_PORT
              value: {{ .Values.service.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
