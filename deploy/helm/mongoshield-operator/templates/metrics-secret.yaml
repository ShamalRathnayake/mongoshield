{{- /*
The bearer token /metrics requires (values.yaml: metrics.auth). Generated once: on
upgrades the existing Secret's token is reused (`lookup`), so scrapers keep working.
`helm template` cannot look anything up, so it renders a fresh random token each time;
use metrics.auth.existingSecret for GitOps tools that render with `helm template`.
*/}}
{{- if and .Values.metrics.auth.enabled (not .Values.metrics.auth.existingSecret) }}
{{- $name := include "mongoshield-operator.metricsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongoshield-operator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.metrics.auth.secretKey) }}
  {{ .Values.metrics.auth.secretKey }}: {{ index $existing.data .Values.metrics.auth.secretKey }}
  {{- else }}
  {{ .Values.metrics.auth.secretKey }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
