{{- /* Optional: scrape /metrics with the Prometheus Operator. */}}
{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mongoshield-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongoshield-operator.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mongoshield-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.metrics.auth.enabled }}
      # The bearer token /metrics requires (values.yaml: metrics.auth).
      authorization:
        type: Bearer
        credentials:
          name: {{ include "mongoshield-operator.metricsSecretName" . }}
          key: {{ .Values.metrics.auth.secretKey }}
      {{- end }}
{{- end }}
