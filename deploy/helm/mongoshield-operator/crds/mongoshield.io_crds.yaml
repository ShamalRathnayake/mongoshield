                      properties:
                        name:
                          type: string
                          maxLength: 253
                          description: Name of the Secret (same namespace).
                          minLength: 1
                        key:
                          type: string
                          maxLength: 253
                          description: Key in the Secret. Defaults to MONGODB_URI.
                      required:
                        - name
                    sample:
                      type: integer
                      format: int64
                      description: Documents per collection compared byte for byte. Defaults to 0.
                      minimum: 0
                      maximum: 10000
                    prefix:
                      type: string
                      maxLength: 32
                      description: Prefix of the temporary database names. Defaults to msdrill_.
                      minLength: 1
                  required:
