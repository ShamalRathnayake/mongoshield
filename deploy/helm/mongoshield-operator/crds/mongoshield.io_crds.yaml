    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Plan
          type: string
          jsonPath: .spec.planRef.name
        - name: Backup ID
          type: string
          jsonPath: .status.backupId
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Dry Run
          type: boolean
          jsonPath: .spec.dryRun
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Documents
          type: integer
          jsonPath: .status.documentsRestored
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: One MongoShield restore of a backup into a deployment.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: One restore of a backup into a deployment.
              properties:
                planRef:
                  type: object
                  description: The MongoShieldBackupPlan whose storage (and key) holds the backup.
                  properties:
                    name:
                      type: string
                      maxLength: 253
                      description: Object name (same namespace).
                      minLength: 1
                  required:
                    - name
                backup:
                  type: object
                  description: Which backup. Defaults to the latest one in the plan's storage.
                  properties:
                    name:
                      type: string
                      maxLength: 253
                      description: A MongoShieldBackup object; its backupId is restored.
                    id:
                      type: string
                      maxLength: 256
                      description: A backup id, or 'latest'.
                  x-kubernetes-validations:
                    - rule: '!(has(self.name) && has(self.id))'
                      message: set backup.name or backup.id
                target:
                  type: object
                  description: 'Where to restore to. Required on purpose: there is no default target.'
                  properties:
                    uriSecretRef:
                      type: object
                      description: Secret key holding the target's connection string.
                      properties:
                        name:
                          type: string
                          maxLength: 253
                          description: Name of the Secret (same namespace).
                          minLength: 1
                        key:
                          type: string
                          maxLength: 253
                          description: Key in the Secret. Defaults to MONGODB_URI.
                      required:
                        - name
                  required:
                    - uriSecretRef
                include:
                  type: array
                  description: 'Namespace patterns to restore (default: everything in the backup).'
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 1024
                exclude:
                  type: array
                  description: Namespace patterns to leave out.
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 1024
                rename:
                  type: array
                  description: Restore under other names, e.g. from app.* to app_restored.*.
                  maxItems: 100
                  items:
                    type: object
                    description: One rename rule.
                    properties:
                      from:
                        type: string
                        maxLength: 256
                        description: Source namespace pattern.
                        minLength: 1
                      to:
                        type: string
                        maxLength: 256
                        description: Target namespace pattern.
                        minLength: 1
                    required:
                      - from
                      - to
                mode:
                  type: string
                  enum:
                    - fail-if-exists
                    - drop
                    - insert
                    - upsert
                  description: What to do with existing target collections. Defaults to fail-if-exists.
                dryRun:
                  type: boolean
                  description: Only plan the restore; write nothing.
                confirm:
                  type: string
                  maxLength: 253
                  description: 'For drop, insert and upsert: must equal target.uriSecretRef.name, to confirm the overwrite.'
                at:
                  type: string
                  maxLength: 64
                  description: 'Point-in-time recovery: ISO date or cluster time (t:i). Needs the change journal.'
                skipIndexes:
                  type: boolean
                  description: Do not create indexes (faster, for throwaway targets).
                usersAndRoles:
                  type: string
                  enum:
                    - skip
                    - create
                    - replace
                  description: Restore the backup's users and roles.
              required:
                - planRef
                - target
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: 'spec is immutable: create a new MongoShieldRestore'
                - rule: '!has(self.mode) || self.mode == ''fail-if-exists'' || (has(self.dryRun) && self.dryRun) || (has(self.confirm) && self.confirm == self.target.uriSecretRef.name)'
                  message: 'mode drop, insert and upsert can overwrite data: set confirm to the target Secret''s name (target.uriSecretRef.name)'
            status:
              type: object
              description: Result of the restore.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: The metadata.generation this status describes.
                conditions:
                  type: array
                  description: Conditions per the Kubernetes API conventions; the authoritative state.
                  maxItems: 16
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    description: One aspect of the object's state.
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        description: Condition type, e.g. Ready or Complete.
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                        description: True, False or Unknown.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: The metadata.generation this condition was computed for.
                      lastTransitionTime:
                        type: string
                        maxLength: 1024
                        description: When status last changed.
                        format: date-time
                      reason:
                        type: string
                        maxLength: 1024
                        description: Machine-readable CamelCase reason.
                      message:
                        type: string
                        maxLength: 32768
                        description: Human-readable details.
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                  description: Pending, Running, Succeeded or Failed.
                jobName:
                  type: string
                  maxLength: 253
                  description: The Job running this restore.
                backupId:
                  type: string
                  maxLength: 1024
                  description: The backup id restored.
                startTime:
                  type: string
                  maxLength: 1024
                  description: When the restore started.
                  format: date-time
                completionTime:
                  type: string
                  maxLength: 1024
                  description: When the restore finished.
                  format: date-time
                durationMs:
                  type: integer
                  format: int64
                  description: How long the restore took, in milliseconds.
                dryRun:
                  type: boolean
                  description: True when nothing was written.
                documentsRestored:
                  type: integer
                  format: int64
                  description: Documents written.
                namespaces:
                  type: integer
                  format: int64
                  description: Namespaces in the restore plan.
                error:
                  type: object
                  description: 'Why the run failed (no secrets: MongoShield scrubs them).'
                  properties:
                    code:
                      type: string
                      maxLength: 1024
                      description: MongoShield error code, e.g. MS_CONNECT_FAILED (see docs/errors.md).
                    message:
                      type: string
                      maxLength: 32768
                      description: What went wrong.
                    hint:
                      type: string
                      maxLength: 32768
                      description: How to fix it, when known.
                    step:
                      type: string
                      maxLength: 1024
                      description: 'The step that failed: setup, lock, backup, verify, replicate or prune.'
                    exitCode:
                      type: integer
                      format: int64
                      description: The container's exit code.
          required:
            - spec
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mongoshielddrills.mongoshield.io
  labels:
    app.kubernetes.io/part-of: mongoshield
spec:
  group: mongoshield.io
  names:
    kind: MongoShieldDrill
    listKind: MongoShieldDrillList
    plural: mongoshielddrills
    singular: mongoshielddrill
    shortNames:
      - msdrill
    categories:
      - mongoshield
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Plan
          type: string
          jsonPath: .spec.planRef.name
        - name: Backup ID
          type: string
          jsonPath: .status.backupId
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: OK
          type: boolean
          jsonPath: .status.ok
        - name: RTO (ms)
          type: integer
          jsonPath: .status.rtoMs
        - name: Problems
          type: integer
          jsonPath: .status.problemCount
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: 'One MongoShield restore drill: restore a backup into a scratch deployment, check it, clean up, measure the RTO.'
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: 'One restore drill: restore a backup into temporary databases on a scratch deployment, check counts, indexes and a sample of documents, drop them, and measure the restore time.'
              properties:
                planRef:
                  type: object
                  description: The MongoShieldBackupPlan whose storage (and key) holds the backup.
                  properties:
                    name:
                      type: string
                      maxLength: 253
                      description: Object name (same namespace).
                      minLength: 1
                  required:
                    - name
                backup:
                  type: object
                  description: Which backup. Defaults to the latest one in the plan's storage.
                  properties:
                    name:
                      type: string
                      maxLength: 253
                      description: A MongoShieldBackup object; its backupId is drilled.
                    id:
                      type: string
                      maxLength: 256
                      description: A backup id, or 'latest'.
                  x-kubernetes-validations:
                    - rule: '!(has(self.name) && has(self.id))'
                      message: set backup.name or backup.id
                target:
                  type: object
                  description: 'The scratch deployment. Never the backup''s source: MongoShield refuses that.'
                  properties:
                    uriSecretRef:
                      type: object
                      description: Secret key holding the scratch deployment's connection string.
                      properties:
                        name:
                          type: string
                          maxLength: 253
                          description: Name of the Secret (same namespace).
                          minLength: 1
                        key:
                          type: string
                          maxLength: 253
                          description: Key in the Secret. Defaults to MONGODB_URI.
                      required:
                        - name
                  required:
                    - uriSecretRef
                sample:
                  type: integer
                  format: int64
                  description: Documents per collection compared byte for byte with the backup.
                  minimum: 0
                  maximum: 10000
                prefix:
                  type: string
                  maxLength: 32
                  description: Prefix of the temporary database names. Defaults to msdrill_.
                  minLength: 1
                include:
                  type: array
                  description: 'Namespace patterns to drill (default: everything in the backup).'
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 1024
                exclude:
                  type: array
                  description: Namespace patterns to leave out.
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 1024
              required:
                - planRef
                - target
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: 'spec is immutable: create a new MongoShieldDrill'
            status:
              type: object
              description: Result of the drill, from MongoShield's drill report.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: The metadata.generation this status describes.
                conditions:
                  type: array
                  description: Conditions per the Kubernetes API conventions; the authoritative state.
                  maxItems: 16
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    description: One aspect of the object's state.
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        description: Condition type, e.g. Ready or Complete.
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                        description: True, False or Unknown.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: The metadata.generation this condition was computed for.
                      lastTransitionTime:
                        type: string
                        maxLength: 1024
                        description: When status last changed.
                        format: date-time
                      reason:
                        type: string
                        maxLength: 1024
                        description: Machine-readable CamelCase reason.
                      message:
                        type: string
                        maxLength: 32768
                        description: Human-readable details.
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                  description: Pending, Running, Succeeded or Failed.
                jobName:
                  type: string
                  maxLength: 253
                  description: The Job running this drill.
                backupId:
                  type: string
                  maxLength: 1024
                  description: The backup id drilled.
                startTime:
                  type: string
                  maxLength: 1024
                  description: When the drill started.
                  format: date-time
                completionTime:
                  type: string
                  maxLength: 1024
                  description: When the drill finished.
                  format: date-time
                ok:
                  type: boolean
                  description: True when the backup restored and every check passed.
                rtoMs:
                  type: integer
                  format: int64
                  description: The measured restore time (RTO), in milliseconds.
                durationMs:
                  type: integer
                  format: int64
                  description: The whole drill, checks and cleanup included.
                documentsRestored:
                  type: integer
                  format: int64
                  description: Documents restored into the scratch deployment.
                namespaces:
                  type: integer
                  format: int64
                  description: Namespaces drilled.
                problemCount:
                  type: integer
                  format: int64
                  description: Problems found.
                problems:
                  type: array
                  description: The first few problems.
                  maxItems: 20
                  items:
                    type: string
                    maxLength: 1024
                error:
                  type: object
                  description: 'Why the run failed (no secrets: MongoShield scrubs them).'
                  properties:
                    code:
                      type: string
                      maxLength: 1024
                      description: MongoShield error code, e.g. MS_CONNECT_FAILED (see docs/errors.md).
                    message:
                      type: string
                      maxLength: 32768
                      description: What went wrong.
                    hint:
                      type: string
                      maxLength: 32768
                      description: How to fix it, when known.
                    step:
                      type: string
                      maxLength: 1024
                      description: 'The step that failed: setup, lock, backup, verify, replicate or prune.'
                    exitCode:
                      type: integer
                      format: int64
                      description: The container's exit code.
          required:
            - spec
