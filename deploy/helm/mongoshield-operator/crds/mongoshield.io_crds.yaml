      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Plan
          type: string
          jsonPath: .spec.planRef.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Backup ID
          type: string
          jsonPath: .status.backupId
        - name: Stored
          type: integer
          jsonPath: .status.bytesStored
          format: int64
        - name: Verified
          type: boolean
          jsonPath: .status.verification.ok
        - name: Kind
          type: string
          jsonPath: .status.kind
          priority: 1
        - name: Deletion
          type: string
          jsonPath: .spec.deletionPolicy
          priority: 1
        - name: Duration (ms)
          type: integer
          jsonPath: .status.durationMs
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: One MongoShield backup run; its status mirrors the backup's manifest.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: One backup run. Create one for an on-demand backup; the operator creates one per scheduled run.
              properties:
                planRef:
                  type: object
                  description: The MongoShieldBackupPlan whose settings this run uses.
                  properties:
                    name:
                      type: string
                      maxLength: 253
                      description: Object name (same namespace).
                      minLength: 1
                  required:
                    - name
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: 'planRef is immutable: create a new MongoShieldBackup'
                verify:
                  type: string
                  enum:
                    - none
                    - fast
                    - deep
                    - drill
                  description: Overrides the plan's verify for this run (drill needs the plan's spec.drill).
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: verify is immutable
                prune:
                  type: boolean
                  description: Apply the plan's retention after this run. Defaults to false.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: prune is immutable
                deletionPolicy:
                  type: string
                  enum:
                    - Retain
                    - Delete
                  description: 'Retain (default): deleting this object leaves the backup in storage. Delete: the operator deletes the backup from storage first (mongoshield delete; held, write-once and depended-on backups are refused). May be changed later.'
                  default: Retain
              required:
                - planRef
            status:
              type: object
              description: Result of the run, mirrored from MongoShield's run report.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: The metadata.generation this status describes.
                conditions:
                  type: array
                  description: Conditions per the Kubernetes API conventions; the authoritative state.
                  maxItems: 16
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    description: One aspect of the object's state.
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        description: Condition type, e.g. Ready or Complete.
                      status:
                        type: string
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                        description: True, False or Unknown.
                      observedGeneration:
                        type: integer
                        format: int64
                        description: The metadata.generation this condition was computed for.
                      lastTransitionTime:
                        type: string
                        maxLength: 1024
                        description: When status last changed.
                        format: date-time
                      reason:
                        type: string
                        maxLength: 1024
                        description: Machine-readable CamelCase reason.
                      message:
                        type: string
                        maxLength: 32768
                        description: Human-readable details.
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Checkpointed
                    - Skipped
                    - Failed
                  description: Pending, Running, Succeeded, Checkpointed, Skipped or Failed.
                jobName:
                  type: string
                  maxLength: 253
                  description: The Job running this backup.
                startTime:
                  type: string
                  maxLength: 1024
                  description: When the run started.
                  format: date-time
                completionTime:
                  type: string
                  maxLength: 1024
                  description: When the run finished.
                  format: date-time
                backupId:
                  type: string
                  maxLength: 1024
                  description: Backup id in storage; use it to restore.
                runId:
                  type: string
                  maxLength: 1024
                  description: MongoShield run id, for matching logs and notifications.
                storage:
                  type: string
                  maxLength: 1024
                  description: Where the backup was stored (without secrets).
                durationMs:
                  type: integer
                  format: int64
                  description: How long the backup took, in milliseconds.
                namespaces:
                  type: integer
                  format: int64
                  description: Collections backed up.
                documents:
                  type: integer
                  format: int64
                  description: Documents backed up.
                bytesRaw:
                  type: integer
                  format: int64
                  description: Uncompressed BSON bytes.
                bytesStored:
                  type: integer
                  format: int64
                  description: Bytes written to storage.
                kind:
                  type: string
                  enum:
                    - full
                    - incremental
                  description: full or incremental.
                parentBackupId:
                  type: string
                  maxLength: 1024
                  description: 'Incremental backups: the backup this one continues.'
                changes:
                  type: integer
                  format: int64
                  description: 'Incremental backups: change events recorded.'
                fullBackupReason:
                  type: string
                  maxLength: 1024
                  description: Why a plan with incrementals took a full backup this time.
                verification:
                  type: object
                  description: How the backup was verified.
                  properties:
                    mode:
                      type: string
                      maxLength: 1024
                      description: none, fast or deep.
                    ok:
                      type: boolean
                      description: True when no problems were found.
                    problemCount:
                      type: integer
                      format: int64
                      description: Problems found.
                    problems:
                      type: array
                      description: The first few problems.
                      maxItems: 20
                      items:
                        type: string
                        maxLength: 1024
                    rtoMs:
                      type: integer
                      format: int64
                      description: 'Drills (verify: drill): the measured restore time in milliseconds.'
                prune:
                  type: object
                  description: Retention applied after the run.
                  properties:
                    deletedBackups:
                      type: integer
                      format: int64
                      description: Backups deleted.
                    kept:
                      type: integer
                      format: int64
                      description: Backups kept.
                error:
                  type: object
                  description: 'Why the run failed (no secrets: MongoShield scrubs them).'
                  properties:
                    code:
                      type: string
                      maxLength: 1024
                      description: MongoShield error code, e.g. MS_CONNECT_FAILED (see docs/errors.md).
                    message:
                      type: string
                      maxLength: 32768
                      description: What went wrong.
                    hint:
                      type: string
                      maxLength: 32768
                      description: How to fix it, when known.
                    step:
                      type: string
                      maxLength: 1024
                      description: 'The step that failed: setup, lock, backup, verify, replicate or prune.'
                    exitCode:
                      type: integer
                      format: int64
                      description: The container's exit code.
          required:
            - spec
