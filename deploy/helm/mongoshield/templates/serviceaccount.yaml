{{- /*
The identity the backup pods run as. Annotate it to use AWS IRSA, GKE Workload
Identity or Azure Workload Identity, so no cloud keys are stored in the cluster.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mongoshield.serviceAccountName" . }}
  labels:
    {{- include "mongoshield.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}
