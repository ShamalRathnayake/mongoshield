<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="MongoShield: encrypted, verified MongoDB backups you can actually restore">
  <!-- The README's hero banner (light theme), in the console's look: an aurora of the brand colours over a dotted grid. -->
  <defs>
    <radialGradient id="g1" cx="0.18" cy="0" r="0.65"><stop offset="0" stop-color="#34d399" stop-opacity="0.22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.85" cy="0.05" r="0.6"><stop offset="0" stop-color="#818cf8" stop-opacity="0.26"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="0.55" cy="1.15" r="0.6"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#0b0d14" fill-opacity="0.09"/></pattern>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="0.55" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b0d14"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="round"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#round)" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <rect width="1200" height="360" fill="#eef1f7"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <rect width="1200" height="360" fill="url(#g1)"/>
    <rect width="1200" height="360" fill="url(#g2)"/>
    <rect width="1200" height="360" fill="url(#g3)"/>
    <!-- Logo tile with a soft glow behind it. -->
    <rect x="556" y="38" width="88" height="88" rx="24" fill="#22d3ee" opacity="0.45" filter="url(#glow)"/>
    <g transform="translate(552 34)">
      <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#tile)"/>
      <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#shine)"/>
  <path d="M48 20 72 29v18c0 14.7-10 27.4-24 32-14-4.6-24-17.3-24-32V29z" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <path d="m37 49 8 8 15-16" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="600" y="190" text-anchor="middle" font-size="60" font-weight="800" letter-spacing="-2" fill="url(#word)">MongoShield</text>
    <text x="600" y="236" text-anchor="middle" font-size="23" font-weight="500" fill="#4b5366">Encrypted, verified MongoDB backups you can actually restore.</text>
  <g>
    <rect x="292.5" y="268" width="152.0" height="38" rx="19" fill="rgba(255,255,255,0.75)" stroke="#34d399" stroke-opacity="0.55"/>
    <circle cx="313.5" cy="287" r="4.5" fill="#34d399"/>
    <!-- textLength pins the label to the measured width whatever font the viewer has. -->
    <text x="326.5" y="292.5" font-size="16" font-weight="600" fill="#1b1f2a" textLength="98.0" lengthAdjust="spacingAndGlyphs">Web console</text>
  </g>
  <g>
    <rect x="458.5" y="268" width="80.0" height="38" rx="19" fill="rgba(255,255,255,0.75)" stroke="#22d3ee" stroke-opacity="0.55"/>
    <circle cx="479.5" cy="287" r="4.5" fill="#22d3ee"/>
    <!-- textLength pins the label to the measured width whatever font the viewer has. -->
    <text x="492.5" y="292.5" font-size="16" font-weight="600" fill="#1b1f2a" textLength="26.0" lengthAdjust="spacingAndGlyphs">CLI</text>
  </g>
  <g>
    <rect x="552.5" y="268" width="163.0" height="38" rx="19" fill="rgba(255,255,255,0.75)" stroke="#818cf8" stroke-opacity="0.55"/>
    <circle cx="573.5" cy="287" r="4.5" fill="#818cf8"/>
    <!-- textLength pins the label to the measured width whatever font the viewer has. -->
    <text x="586.5" y="292.5" font-size="16" font-weight="600" fill="#1b1f2a" textLength="109.0" lengthAdjust="spacingAndGlyphs">Node.js library</text>
  </g>
  <g>
    <rect x="729.5" y="268" width="178.0" height="38" rx="19" fill="rgba(255,255,255,0.75)" stroke="#f472b6" stroke-opacity="0.55"/>
    <circle cx="750.5" cy="287" r="4.5" fill="#f472b6"/>
    <!-- textLength pins the label to the measured width whatever font the viewer has. -->
    <text x="763.5" y="292.5" font-size="16" font-weight="600" fill="#1b1f2a" textLength="124.0" lengthAdjust="spacingAndGlyphs">No mongodump</text>
  </g>
  </g>
</svg>
