# Versions and publishes the npm packages with Changesets. See RELEASING.md.
#
# Every push to main runs changesets/action, which does one of two things:
#   - there are unreleased changesets in .changeset/  -> open or update the
#     "chore: version packages" pull request (bumps versions, writes CHANGELOG.md)
#   - that pull request was just merged (no changesets left, versions not on npm yet)
#                                                     -> `changeset publish`: publish to
#     npm, push the git tags (mongoshield@X.Y.Z, @mongoshield/console@X.Y.Z) and create
#     a GitHub release per package from its changelog
# Then, if mongoshield was published, the Docker images are built for that version.
#
# In pre mode (.changeset/pre.json says "mode": "pre") versions look like 2.0.0-next.3
# and go to the `next` dist-tag. After `changeset pre exit` and the version PR they are
# stable and go to `latest`. Nothing in this file changes between the two.
#
# Authentication: npm trusted publishing (OIDC). npmjs.com trusts this repository +
# this workflow file (configure it per package, see RELEASING.md), so no NPM_TOKEN
# secret exists. `changeset publish` runs `pnpm publish`; pnpm (v11+) does the OIDC
# token exchange itself and attaches provenance automatically for a public package
# from a public repository, so the npm CLI version on the runner does not matter.
name: Release

on:
  push:
    branches: [main]
  # Re-run a publish that failed half-way (e.g. one package published, the other not).
  # `changeset publish` skips versions that are already on npm, so this is safe.
  workflow_dispatch:

# One release at a time, and never cancel one half-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit, tags and GitHub releases
      pull-requests: write # open/update the version pull request
      id-token: write # npm trusted publishing (OIDC) + provenance
    outputs:
      # "true" when something was published to npm.
      published: ${{ steps.changesets.outputs.published }}
      # The mongoshield version just published (empty when it was not published).
      mongoshield-version: ${{ steps.versions.outputs.mongoshield }}
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned in package.json ("packageManager"). It must
      # come before setup-node, which looks for pnpm when it sets up its cache.
      - uses: pnpm/action-setup@v6
      # No `registry-url` on purpose: it writes an .npmrc with a placeholder
      # NODE_AUTH_TOKEN, and a token (even a fake one) can get in the way of the OIDC
      # exchange. The default registry is registry.npmjs.org anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The same package checks CI runs (publint + attw). Cheap, and a broken
      # package must never reach npm even if CI was skipped for the merge.
      - run: pnpm check:package

      # `pnpm publish` is routed through the npm CLI by a stand-in `pnpm` placed first on
      # PATH (.github/scripts/npm-publish/pnpm): npm's own trusted publishing (OIDC) is the
      # documented path, and pnpm 12's native publish has reported OIDC problems. Trusted
      # publishing needs npm 11.5.1 or newer.
      #
      # NPM_TOKEN goes into ~/.npmrc as a reference (npm reads the variable at publish
      # time, from the changesets step's env below). npm still tries OIDC first and uses
      # the token only for packages without a trusted publisher, i.e. a first publish.
      - name: Publish with the npm CLI
        run: |
          npm install --global npm@11
          npm --version
          echo "REAL_PNPM=$(command -v pnpm)" >> "$GITHUB_ENV"
          echo "${GITHUB_WORKSPACE}/.github/scripts/npm-publish" >> "$GITHUB_PATH"
          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "${HOME}/.npmrc"

      # changesets/action v2 needs @changesets/cli v3 (this repository uses v3).
      - uses: changesets/action@v2
        id: changesets
        with:
          # `pnpm build` already ran above; this only publishes, tags and releases.
          publish-script: pnpm exec changeset publish
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: true
        env:
          # Read by @changesets/changelog-github while `changeset version` writes the
          # changelogs (links to PRs and authors). The action itself uses its
          # `github-token` input, which defaults to this same token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Packages with a trusted publisher on npm publish through OIDC (id-token
          # above). A package's first publish can't: npm only accepts a trusted
          # publisher for a package that already exists, so this token covers it.
          # The action writes it to .npmrc only when it is set.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `published-packages` is a JSON array like
      #   [{"name":"mongoshield","version":"2.0.0"},{"name":"@mongoshield/console","version":"2.0.0"}]
      # in no guaranteed order, so pick mongoshield by name rather than by position.
      # The value goes through an environment variable, never into the script text.
      - name: Find the published mongoshield version
        id: versions
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version="$(jq -r '.[] | select(.name == "mongoshield") | .version' <<< "${PUBLISHED}")"
          echo "mongoshield=${version}" >> "$GITHUB_OUTPUT"
          echo "Published: ${PUBLISHED}"

  # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so the images for a
  # new npm release are built by calling the Docker workflow directly. It builds both
  # images (CLI and console); they share the version because the two packages are
  # released in lockstep (`fixed` in .changeset/config.json).
  docker:
    needs: release
    if: needs.release.outputs.mongoshield-version != ''
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.mongoshield-version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
