# Builds the MongoShield container images and publishes them to ghcr.io:
#   ghcr.io/shamalrathnayake/mongoshield           the CLI (docker/Dockerfile)
#   ghcr.io/shamalrathnayake/mongoshield-console   the web console (docker/console.Dockerfile)
#   ghcr.io/shamalrathnayake/mongoshield-operator  the Kubernetes operator (docker/operator.Dockerfile)
#
# When it runs, and what it pushes:
#   pull request touching the image  build linux/amd64 and linux/arm64, smoke-test both,
#                                    Trivy scan; push nothing
#   push to main                     the above, then push multi-arch `:next` and `:sha-<short>`
#   release tag mongoshield@X.Y.Z    push `:X.Y.Z`, `:X.Y`, `:X` and `:latest` (no `latest`,
#     (or vX.Y.Z)                    `X.Y` or `X` for prereleases such as 2.0.0-next.3)
#   workflow_call / dispatch         same as a tag, for the version passed in
#
# `:latest` follows releases only, for all three images, so the console quickstart
# (`docker run … ghcr.io/shamalrathnayake/mongoshield-console`) runs the newest release,
# never an untested build from main. `:next` is the newest main build.
#
# Publishing happens only from main or a release tag: a workflow_dispatch from any other
# branch builds and tests but pushes nothing. The pushing job runs in the protected
# `release` environment (restrict it to main and tags in the repository settings).
#
# Every pushed image gets an SBOM and SLSA provenance attestation (attached by BuildKit)
# and a keyless cosign signature (Sigstore, using this workflow's GitHub OIDC identity).
# Verify that an image was signed by this workflow on main or on a release tag (images
# for npm releases are built by release.yml calling this workflow from main):
#   cosign verify ghcr.io/shamalrathnayake/mongoshield:2 \
#     --certificate-identity-regexp '^https://github\.com/ShamalRathnayake/mongoshield/\.github/workflows/docker\.yml@refs/(heads/main|tags/(mongoshield@|v)[0-9].*)$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Note: tags pushed by another workflow with GITHUB_TOKEN (changesets in release.yml) do
# not trigger `push: tags`. The release workflow calls this one via workflow_call
# after publishing (see the `workflow_call` input below).
#
# Third-party actions are pinned to full commit SHAs (the comment names the release), so
# a moved or force-pushed tag cannot change what runs with the registry and signing
# credentials. Dependabot proposes updates (.github/dependabot.yml).
name: Docker

on:
  pull_request:
    paths:
      - docker/** # includes docker/smoke/ (the console's end-to-end smoke tests)
      - .dockerignore
      - .trivyignore
      - .github/workflows/docker.yml
      - packages/mongoshield/**
      - packages/console/**
      - packages/operator/**
      - pnpm-lock.yaml
  push:
    branches: [main]
    tags:
      - "mongoshield@*"
      # Full versions only (v2.0.0, v2.1.0-next.1). The moving major tag `v2`, which
      # GitHub Action users reference (`.../action@v2`), must not trigger an image build:
      # "2" is not a version the tag logic below can publish.
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_call:
    inputs:
      version:
        description: Released version to publish, e.g. 2.0.0 (without the mongoshield@ prefix)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 2.0.0. Leave empty to publish `next` from main.
        type: string
        required: false

# One build per ref at a time; a newer push to the same branch replaces an older build.
# Releases are never cancelled (their group includes the unique tag/version).
concurrency:
  group: docker-${{ github.ref }}-${{ inputs.version || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Works out, once, the versions to tag with and whether to push at all.
  plan:
    name: Decide version and push
    runs-on: ubuntu-latest
    outputs:
      # The library/console version of a release ("" when building `next`).
      version: ${{ steps.decide.outputs.version }}
      # The operator's version for the same release (packages/operator/package.json).
      operator-version: ${{ steps.decide.outputs.operator-version }}
      # "true" when the images are published.
      push: ${{ steps.decide.outputs.push }}
      # Commit time, passed to the builds as NPM_BEFORE (see docker/Dockerfile).
      npm-before: ${{ steps.decide.outputs.npm-before }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Decide version and push
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=""
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION}"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            # mongoshield@2.0.0 -> 2.0.0, v2.0.0 -> 2.0.0
            version="${REF_NAME#mongoshield@}"
            version="${version#v}"
          fi
          # The operator has its own version line: on a release, its image is tagged
          # with its package.json version instead of the library's.
          operator_version=""
          if [[ -n "${version}" ]]; then
            operator_version="$(jq -r .version packages/operator/package.json)"
          fi
          # Publish only from main or a release tag, never from a PR or another branch.
          push=false
          if [[ "${EVENT}" != "pull_request" ]] && [[ "${REF}" == "refs/heads/main" || "${REF}" == refs/tags/* ]]; then
            push=true
          elif [[ "${EVENT}" != "pull_request" ]]; then
            echo "::notice::${REF} is not main or a release tag: building and testing only, nothing is pushed."
          fi
          {
            echo "version=${version}"
            echo "operator-version=${operator_version}"
            echo "push=${push}"
            echo "npm-before=$(git log -1 --format=%cI)"
          } >> "$GITHUB_OUTPUT"
          echo "Version: ${version:-<none, building next>}  Operator: ${operator_version:-<none>}  Push: ${push}"

  # Builds each image for linux/amd64, runs it, and scans it. Nothing here can push or
  # sign: no packages or id-token permission.
  image:
    name: Build and test (${{ matrix.image }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mongoshield
            dockerfile: docker/Dockerfile
          - image: mongoshield-console
            dockerfile: docker/console.Dockerfile
          - image: mongoshield-operator
            dockerfile: docker/operator.Dockerfile
    env:
      # The image built for the smoke test and the vulnerability scan (never pushed).
      LOCAL_IMAGE: ${{ matrix.image }}:ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # 1. Build for the runner's platform and load it into the local Docker daemon,
      #    so it can be run and scanned before anything is published.
      - name: Build (linux/amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            NPM_BEFORE=${{ needs.plan.outputs.npm-before }}
          # The GitHub Actions cache makes the multi-arch build in `publish` reuse these layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # 2. Does it start? --version needs no database; --help lists every command,
      #    which proves all modules load. Runs as the image's non-root user.
      - name: Smoke test (CLI)
        if: matrix.image == 'mongoshield'
        run: |
          docker run --rm "${LOCAL_IMAGE}" --version
          docker run --rm "${LOCAL_IMAGE}" --help
          test "$(docker inspect --format '{{.Config.User}}' "${LOCAL_IMAGE}")" = "65532:65532"

      # The console's zero-setup promise, end to end against a real MongoDB 8 replica set:
      # no env and a fresh volume → generated secret.key, setup window (admin without
      # the token), connection check, "Back up now" into Local backups (encrypted with a
      # console-kept key), restore checked with mongosh, recovery key, restart with the
      # same key, a different MONGOSHIELD_SECRET refused, HEALTHCHECK healthy, SIGINT and
      # SIGTERM exit 0, and an explicit/too-short MONGOSHIELD_SECRET as before.
      - name: Smoke test (console, zero setup)
        if: matrix.image == 'mongoshield-console'
        env:
          SMOKE_PORT: "8080"
        run: docker/smoke/console-zero-setup.sh "${LOCAL_IMAGE}"

      # Atlas-style `mongodb+srv://` strings from the distroless image: SRV + TXT lookups
      # (CoreDNS on the Docker network), TLS required by mongod with a private CA mounted
      # as tlsCAFile, the TXT record's authSource honoured, and TLS/DNS failures explained.
      - name: Smoke test (console, SRV + TLS)
        if: matrix.image == 'mongoshield-console'
        env:
          SMOKE_PORT: "8081"
        run: docker/smoke/console-srv-tls.sh "${LOCAL_IMAGE}"

      # The operator needs a cluster to do anything, but without one it must still
      # start, serve /healthz and shut down cleanly on SIGTERM.
      - name: Smoke test (operator)
        if: matrix.image == 'mongoshield-operator'
        run: |
          set -euo pipefail
          docker run -d --name operator -p 127.0.0.1:8080:8080 -e LEADER_ELECTION=false "${LOCAL_IMAGE}"
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          # To a file first: `grep -q` closing the pipe early would fail curl under pipefail.
          curl -fsS http://localhost:8080/metrics > operator-metrics.txt
          grep -q mongoshield_operator_leader operator-metrics.txt
          docker stop operator
          test "$(docker inspect --format '{{.State.ExitCode}}' operator)" = "0"
          test "$(docker inspect --format '{{.Config.User}}' "${LOCAL_IMAGE}")" = "65532:65532"

      # 3. Vulnerability scans. trivy-action v0.35.0+ is required (earlier tags were
      #    force-pushed to credential-stealing code in March 2026, CVE-2026-33634); it is
      #    pinned by SHA, and the Trivy binary it installs by version.
      #    a) Fail on known HIGH/CRITICAL vulnerabilities that have a fix: upgrade.
      - name: Vulnerability scan (Trivy, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Documented exceptions, each with a reason and an expiry date.
          trivyignores: .trivyignore
          exit-code: "1"
          format: table
      #    b) Also fail on CRITICAL ones without a fix: there is nothing to upgrade, but
      #       someone must look (swap the dependency, or add a .trivyignore entry with a
      #       reason and an expiry date when it cannot be reached from MongoShield).
      - name: Vulnerability scan (Trivy, unfixed critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore
          exit-code: "1"
          format: table
          # The first scan already downloaded the vulnerability database.
          skip-setup-trivy: true

  # The arm64 images are published too, so they are started for real on GitHub's arm64
  # runners (natively, no QEMU): an arm64-only regression must not ship untested.
  arm64:
    name: Build and test on arm64 (${{ matrix.image }})
    needs: plan
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mongoshield
            dockerfile: docker/Dockerfile
          - image: mongoshield-console
            dockerfile: docker/console.Dockerfile
          - image: mongoshield-operator
            dockerfile: docker/operator.Dockerfile
    env:
      LOCAL_IMAGE: ${{ matrix.image }}:ci-arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build (linux/arm64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            NPM_BEFORE=${{ needs.plan.outputs.npm-before }}
          cache-from: type=gha,scope=arm64-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.image }}
      - name: Check the architecture
        run: test "$(docker inspect --format '{{.Architecture}}' "${LOCAL_IMAGE}")" = "arm64"
      - name: Smoke test (CLI)
        if: matrix.image == 'mongoshield'
        run: |
          docker run --rm "${LOCAL_IMAGE}" --version
          docker run --rm "${LOCAL_IMAGE}" --help
      # The full zero-setup run (a real MongoDB 8 replica set, backup and restore) on arm64.
      - name: Smoke test (console, zero setup)
        if: matrix.image == 'mongoshield-console'
        env:
          SMOKE_PORT: "8080"
        run: docker/smoke/console-zero-setup.sh "${LOCAL_IMAGE}"
      - name: Smoke test (operator)
        if: matrix.image == 'mongoshield-operator'
        run: |
          set -euo pipefail
          docker run -d --name operator -p 127.0.0.1:8080:8080 -e LEADER_ELECTION=false "${LOCAL_IMAGE}"
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/healthz
          docker stop operator
          test "$(docker inspect --format '{{.State.ExitCode}}' operator)" = "0"

  # Builds every platform, pushes and signs. Only after both platforms passed their tests,
  # only from main or a release tag, and in the protected `release` environment. This is
  # the only job with permission to push packages and to get a signing identity.
  publish:
    name: Publish (${{ matrix.image }})
    needs: [plan, image, arm64]
    if: needs.plan.outputs.push == 'true'
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mongoshield
            dockerfile: docker/Dockerfile
          - image: mongoshield-console
            dockerfile: docker/console.Dockerfile
          # The operator has its own version line (see the plan job).
          - image: mongoshield-operator
            dockerfile: docker/operator.Dockerfile
            own-version: true
    env:
      IMAGE: ghcr.io/shamalrathnayake/${{ matrix.image }}
      VERSION: ${{ matrix.own-version && needs.plan.outputs.operator-version || needs.plan.outputs.version }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing (OIDC token -> Sigstore certificate)
      # SBOM and provenance are pushed to ghcr.io as part of the image: no extra permission.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Tags and labels. `type=semver` skips `latest`, `X.Y` and `X` for prereleases
      # automatically, so 2.0.0-next.3 is only ever published as `:2.0.0-next.3`.
      # `latest=auto` gives `:latest` to stable releases only; main gets `:next` and `:sha-…`.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=semver,pattern={{major}},value=${{ env.VERSION }},enable=${{ env.VERSION != '' }}
            type=raw,value=next,enable=${{ env.VERSION == '' && github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ env.VERSION == '' && github.ref == 'refs/heads/main' }}

      # QEMU lets the amd64 runner build the arm64 image. Only the deps stage runs
      # emulated; the build stage runs natively (see FROM --platform in the Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build every platform and push. Layers come from the cache, so this is mostly
      #    the arm64 deps stage plus the upload.
      #    sbom: an SPDX SBOM of the image contents, attached to the image.
      #    provenance mode=max: SLSA provenance with full build details (no secrets: none
      #    are passed to the build).
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            NPM_BEFORE=${{ needs.plan.outputs.npm-before }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # 5. Sign the pushed manifest list by digest (signing a tag could sign whatever the
      #    tag points to by then). One signature covers every tag and both platforms.
      #    Keyless: cosign gets a short-lived certificate for this workflow's identity;
      #    the signature is recorded in Sigstore's public transparency log.
      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
