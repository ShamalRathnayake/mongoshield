# Static checks for the distribution kit: the Helm chart, the plain Kubernetes
# manifest, the shell scripts, the Compose example, the example configs and the
# example GitHub Actions workflows.
# None of these are covered by the package's own tests, and a broken chart or
# script is only noticed by users otherwise.
#
# Actions are pinned by major version (fixes arrive automatically; Dependabot
# proposes major upgrades). Pin to commit SHAs if your policy requires it.
name: Examples and deploy

on:
  pull_request:
    paths:
      - action/**
      - deploy/**
      - docker/**
      - examples/**
      - .github/workflows/examples.yml
  push:
    branches: [main]
    paths:
      - action/**
      - deploy/**
      - docker/**
      - examples/**
      - .github/workflows/examples.yml

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm:
    name: Helm chart and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # v5: current major
      - uses: azure/setup-helm@v4 # v4: current major

      # Lint, then render with defaults and with every optional feature switched on,
      # so template branches that are off by default are exercised too.
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/mongoshield
          helm template test deploy/helm/mongoshield > rendered-default.yaml
          helm template test deploy/helm/mongoshield \
            --set identity.secretName=mongoshield-identity \
            --set persistence.enabled=true,persistence.existingClaim=backups \
            --set recipients[0]=age1example \
            --set ttlSecondsAfterFinished=86400 \
            --set-string podLabels.team=platform \
            > rendered-full.yaml

      # The operator chart: defaults (cluster-wide), and namespaced with every option on.
      - name: Lint and render the operator chart
        run: |
          helm lint deploy/helm/mongoshield-operator
          helm template ops deploy/helm/mongoshield-operator --namespace mongoshield-system \
            > rendered-operator-default.yaml
          helm template ops deploy/helm/mongoshield-operator --namespace mongoshield-system \
            --set 'watchNamespaces={prod,staging}' \
            --set replicaCount=2 \
            --set metrics.serviceMonitor.enabled=true \
            --set jobImage.pullPolicy=Always \
            --set rbac.aggregateToDefaultRoles=false \
            --set-string podLabels.team=platform \
            > rendered-operator-full.yaml

      # deploy/operator/operator.yaml is rendered from the operator chart; fail if it
      # was not regenerated after a chart change. (The script needs only Node and helm.)
      - uses: actions/setup-node@v5 # v5: current major
        with:
          node-version: 24
          # setup-node v5 caches the package manager named in package.json (pnpm),
          # which this job never installs; the script needs no packages.
          package-manager-cache: false
      - name: Plain operator manifests are up to date
        run: node packages/operator/scripts/generate-manifests.ts --check

      # Validate the rendered chart and the plain manifest against the Kubernetes
      # API schemas (offline; no cluster needed).
      - name: Validate against Kubernetes schemas (kubeconform)
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          "$(go env GOPATH)/bin/kubeconform" -strict -summary \
            rendered-default.yaml rendered-full.yaml deploy/kubernetes/cronjob.yaml
          # The operator: chart renders and plain manifests. ServiceMonitor is a
          # Prometheus Operator kind with no built-in schema. The CRDs themselves are not
          # here: kubeconform's schema set has no CustomResourceDefinition schema. A real
          # API server validates them instead (including their CEL rules), in the operator
          # e2e workflow (operator-e2e.yml), and the operator's unit tests check them.
          "$(go env GOPATH)/bin/kubeconform" -strict -summary -skip ServiceMonitor \
            rendered-operator-default.yaml rendered-operator-full.yaml \
            deploy/operator/operator.yaml

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # v5: current major
      # shellcheck is preinstalled on GitHub's Ubuntu runners.
      - run: shellcheck docker/install-sdks.sh action/run.sh

  workflows:
    name: Example workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # v5: current major
      # The copy-paste GitHub Actions templates in examples/github-actions are not run
      # here (they need a real cluster and bucket), so lint them instead: actionlint
      # checks workflow syntax, expressions, action inputs and, through the
      # preinstalled shellcheck, every `run:` script. Pinned for reproducible results.
      - name: Lint the example workflows (actionlint)
        run: |
          bash <(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color examples/github-actions/*.yml

  compose:
    name: Compose example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # v5: current major
      # Parses and validates the Compose file without starting anything.
      - run: docker compose -f examples/docker-compose/compose.yaml config --quiet
      - run: docker compose -f examples/console-compose/compose.yaml config --quiet
