# End-to-end test of the Kubernetes operator in a kind cluster: builds the MongoShield
# and operator images, installs the Helm chart, then backs up and restores a real
# MongoDB through MongoShieldBackupPlan / MongoShieldBackup / MongoShieldRestore
# objects (packages/operator/test/e2e). About 10 minutes, so it only runs when the
# operator, its chart or the images change, and on demand.
#
# The test itself is packages/operator/scripts/e2e.ts, the same script developers run
# locally (`pnpm --filter @mongoshield/operator test:e2e`). kind-action installs kind
# and creates the cluster; the script finds it by name and loads the images into it.
#
# Actions are pinned by major version (fixes arrive automatically; Dependabot
# proposes major upgrades). Pin to commit SHAs if your policy requires it.
name: Operator e2e

on:
  pull_request:
    paths:
      - packages/operator/**
      - deploy/helm/mongoshield-operator/**
      - docker/Dockerfile
      - docker/operator.Dockerfile
      - .github/workflows/operator-e2e.yml
  push:
    branches: [main]
    paths:
      - packages/operator/**
      - deploy/helm/mongoshield-operator/**
      - docker/Dockerfile
      - docker/operator.Dockerfile
      - .github/workflows/operator-e2e.yml
  workflow_dispatch:

concurrency:
  group: operator-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Operator end-to-end (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5 # v5: current major
      # Installs the pnpm version pinned in package.json ("packageManager"). It must
      # come before setup-node, which looks for pnpm when it sets up its cache.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7 # v5: current major
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - uses: azure/setup-helm@v4 # v4: current major
      # The cluster name must match scripts/e2e.ts (CLUSTER), so the script reuses it.
      - uses: helm/kind-action@v1 # v1: current major
        with:
          cluster_name: mongoshield-e2e
          wait: 180s
      - name: Run the e2e test
        run: pnpm --filter @mongoshield/operator test:e2e
        env:
          # Keep the cluster for the failure dump below (the runner is thrown away anyway).
          E2E_KEEP_CLUSTER: "1"
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get all,msplan,msbackup,msrestore,events -A || true
          kubectl -n mongoshield-system logs deployment/mongoshield-operator --tail=500 || true
