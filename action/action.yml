# MongoShield GitHub Action: run a MongoShield command (backup, run, verify, restore)
# in a workflow, with no Docker image and nothing installed on the runner beforehand.
#
#   - uses: ShamalRathnayake/mongoshield/action@v2
#     id: backup
#     with:
#       uri: ${{ secrets.MONGODB_URI }}
#       storage: s3://acme-backups/prod
#       recipients: ${{ vars.BACKUP_PUBLIC_KEY }}
#   - run: echo "Backed up ${{ steps.backup.outputs.backup-id }}"
#
# It is a composite action: a few shell steps that install a pinned mongoshield (with
# `npm install --ignore-scripts`, exact versions) and run it. The logic lives in run.sh
# next to this file; see README.md for every input.

name: MongoShield
description: Back up, verify and restore MongoDB with MongoShield. No mongodump required.
author: Shamal Rathnayake
branding:
  icon: shield
  color: green

inputs:
  command:
    description: "What to run: backup, run (backup + verify + prune + notify, per the config file), verify or restore."
    required: false
    default: backup
  uri:
    description: MongoDB connection string. Pass a secret; it is masked in the logs. Falls back to MONGODB_URI from the environment or the config file.
    required: false
    default: ""
  storage:
    description: "Where backups live: s3://bucket/prefix?region=..., or a directory path. Falls back to the config file."
    required: false
    default: ""
  recipients:
    description: Comma-separated age public keys (age1...) to encrypt new backups for. Public keys are not secret.
    required: false
    default: ""
  identity:
    description: An age secret key (AGE-SECRET-KEY-1...) for restore and `verify --deep`. Pass a secret; it is masked.
    required: false
    default: ""
  config:
    description: Path to a mongoshield.config.{ts,js,json} file. Defaults to one in the working directory, if present.
    required: false
    default: ""
  args:
    description: "Extra arguments, split on whitespace, e.g. `--exclude *.sessions --label trigger=ci`. Values cannot contain spaces."
    required: false
    default: ""
  packages:
    description: Extra npm packages to install next to mongoshield, space-separated (e.g. `@aws-sdk/client-kms@3` for AWS KMS). Cloud SDKs for s3://, gs://, az:// and sftp:// storage, set in the `storage` input, MONGOSHIELD_STORAGE or the config file, are added automatically.
    required: false
    default: ""
  version:
    description: "The mongoshield npm version or dist-tag to run. Empty (default): the release this Action ref belongs to, so pinning the Action to a release tag or commit SHA pins the CLI too. `latest` runs the newest stable release."
    required: false
    default: ""
  node-version:
    description: Node.js version to set up (MongoShield needs 22.12 or newer). Set to "" to use the runner's Node.js.
    required: false
    default: "24"
  working-directory:
    description: Directory to run in (where the config file and relative storage paths are resolved).
    required: false
    default: "."

outputs:
  backup-id:
    description: Id of the backup that was created (backup, run), checked (verify) or restored (restore), when the command reports one.
    value: ${{ steps.mongoshield.outputs.backup-id }}
  json:
    description: The command's full `--json` output.
    value: ${{ steps.mongoshield.outputs.json }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      if: inputs.node-version != ''
      # Pinned to a full commit SHA: a moved tag cannot change what runs next to your
      # database credentials.
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # setup-node v5 caches the caller's package manager when their package.json has a
        # "packageManager" field, and fails if that tool (pnpm, yarn) isn't installed yet.
        # The Action installs mongoshield with npm into its own temp folder, so it needs
        # no cache from the caller's project: off, or any pnpm/yarn repo would break.
        package-manager-cache: false

    # --- OneDrive only: carry the rotated sign-in token from run to run ----------------
    # Microsoft refresh tokens stop working 90 days after they were issued, and every
    # refresh returns a new one. mongoshield writes the newest to a token state file
    # (MONGOSHIELD_ONEDRIVE_TOKEN_STATE), encrypted with a key derived from the
    # MONGOSHIELD_ONEDRIVE_TOKEN secret, and these steps keep that file in the Actions
    # cache, so the cache only ever holds ciphertext. Nothing here prints a secret.
    # The steps are skipped unless the storage is onedrive:// (the `storage` input,
    # MONGOSHIELD_STORAGE or the config file). See docs/guides/onedrive.md.
    - name: Check for OneDrive storage
      id: onedrive
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_STORAGE: ${{ inputs.storage }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        # The same places run.sh looks for the storage, searched for onedrive:// or
        # onedriveStorage( (lower-cased, as schemes are case-insensitive).
        text="${INPUT_STORAGE:-} ${MONGOSHIELD_STORAGE:-}"
        config="${INPUT_CONFIG:-}"
        if [[ -z "$config" ]]; then
          for name in mongoshield.config.ts mongoshield.config.mts mongoshield.config.js \
            mongoshield.config.mjs mongoshield.config.json; do
            if [[ -f "$name" ]]; then config="$name"; break; fi
          done
        fi
        if [[ -n "$config" && -f "$config" ]]; then text="$text $(cat "$config")"; fi
        text="$(printf '%s' "$text" | tr '[:upper:]' '[:lower:]')"
        if [[ "$text" == *onedrive://* || "$text" == *onedrivestorage* ]]; then
          # A path the caller chose themselves is kept; otherwise one in the runner's
          # temp folder, outside the workspace, so it can never be committed or uploaded.
          path="${MONGOSHIELD_ONEDRIVE_TOKEN_STATE:-${RUNNER_TEMP}/mongoshield-onedrive/token-state.json}"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
        else
          # Not OneDrive: pass on whatever the caller set (usually nothing), untouched.
          echo "path=${MONGOSHIELD_ONEDRIVE_TOKEN_STATE:-}" >> "$GITHUB_OUTPUT"
        fi

    # The newest token state: restore-keys matches the most recent entry saved by this
    # workflow's job (each run saves under a key of its own, below).
    - name: Restore the OneDrive token state
      if: steps.onedrive.outputs.enabled == 'true'
      # Pinned to a full commit SHA, like setup-node above.
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.onedrive.outputs.path }}
        key: mongoshield-onedrive-token-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: mongoshield-onedrive-token-${{ github.workflow }}-${{ github.job }}-

    # Inputs are passed as environment variables, never pasted into the script text:
    # `${{ inputs.x }}` inside `run:` would let a crafted value inject shell commands.
    - name: Run mongoshield ${{ inputs.command }}
      id: mongoshield
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        # The token state file for onedrive:// storage; otherwise the caller's own value
        # (an empty value counts as unset).
        MONGOSHIELD_ONEDRIVE_TOKEN_STATE: ${{ steps.onedrive.outputs.path }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_URI: ${{ inputs.uri }}
        INPUT_STORAGE: ${{ inputs.storage }}
        INPUT_RECIPIENTS: ${{ inputs.recipients }}
        INPUT_IDENTITY: ${{ inputs.identity }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_VERSION: ${{ inputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/run.sh"

    # Saved even when the run failed: the token may have rotated before the failure,
    # and the old one could already be past its 90 days. A unique key per run attempt,
    # because cache entries are immutable. No entry is made if the file does not exist.
    - name: Save the OneDrive token state
      if: always() && steps.onedrive.outputs.enabled == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.onedrive.outputs.path }}
        key: mongoshield-onedrive-token-${{ github.workflow }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
