<!doctype html>
<!--
  The single page of the MongoShield console. Vite bundles main.tsx and styles.css into
  external files, so the page has no inline scripts or styles (strict CSP).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>MongoShield Console</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The MongoShield console needs JavaScript.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
